[project]
name = "enterprise-content-ops"
version = "1.0.0"
description = "ADK 2.0 multi-agent content operations system demonstrating SequentialAgent, ParallelAgent, LoopAgent workflows, skill patterns, and deployment to Vertex AI Agent Engine."
authors = [{ name = "Nyle & Moon", email = "hello@nyleandmoon.com" }]
license = {text = "Apache License 2.0"}
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "google-adk>=1.3.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "google-cloud-aiplatform>=1.90.0",
]

[dependency-groups]
dev = [
    "google-adk[eval]>=1.3.0",
    "pytest-asyncio>=0.26.0",
    "pytest>=8.3.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
